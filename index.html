<!DOCTYPE html>

        <div class="left">
            <!-- Left Side home bar -->
             <div>
                <img class="close invert" src="close.svg" alt="">
             </div>
            <div class="home bg-grey rounded m-1 p-1">
                <div class="logo invert "><img src="logo.svg" alt="logo"></div>

                </ul>
            </div>

            <!-- Library -->
            <div class="library bg-grey rounded m-1 p-1">
                <div class="heading">
                    <img class="invert" src="playlist.svg" alt="">
                    <h2>
                        Your Library
                    </h2>
                </div>  
                <div class="songsList">
                    <ul>

                            <div class="playnow">

                                <img class="invert" src="play.svg" alt="">
                            </div>

                    </ul>

                    <div><a href="https://www.spotify.com/jp/legel/cookies-policy"><span>Cookies</span></a></div>
                    <div><a href="https://www.spotify.com/jp/legel/privacy-policy/#s3"><span>About Ads</span></a></div>
                    <div><a href="https://www.spotify.com/jp/accessibility/"><span>Accessibility</span></a></div>
                </div>
            </div>

        </div>

        <!--Right Side Data  -->
        <div class="right bg-grey rounded">
            <!-- Header -->
            <div class="header">
                <div class="nav invert">
                    <div class="flex headericon">
                        <img class="hamburger" src="hamburger.svg" alt="">
                        
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" color="#000000" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M15 6C15 6 9.00001 10.4189 9 12C8.99999 13.5812 15 18 15 18" />
                        </svg>
                        
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" color="#fff" fill="none" stroke="#141B34" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9.00005 6C9.00005 6 15 10.4189 15 12C15 13.5812 9 18 9 18" />
                        </svg>
                    </div>
                </div>
                <div class="buttons">
                    <button class="signup">Sign Up</button>
                    <button class="login">Login</button>
                </div>

                    </div> -->

                        <p>Amrinder Gill</p>
                    </div>
                </div>
                <div class="playbar">
                    <div class="seekbar">
                        <div class="circle">

                        </div>
                    </div>
                    <div class="abovebar">

                        <div class="songinfo">
                            
                        </div>
                        <div class="songbutton">
                            <img  id="previous" class="invert" src="previous.svg" alt="">
                            <img  id="play" class="invert" src="play.svg" alt="">
                            <img  id="next" class="invert" src="next.svg" alt="">
                        </div>
                        <div class="flex voltime">

                            <div class="songtime">
                                
                            </div>
                            <div class="volume">
                                <img width="28px" class="invert" src="volume.svg" alt="" id="volbtn">
                                <div class="range">
                                    <input type="range" name="volume">
